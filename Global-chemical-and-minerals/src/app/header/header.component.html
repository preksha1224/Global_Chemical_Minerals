<header class="app-header">
  <div class="header-logo">
    <div class="logo-icon">G</div>
    <div class="logo-text">
      <span class="brand-name">Global Chemicals</span>
      <span class="brand-sub">&amp; MINERALS &bull; EST. 2008</span>
    </div>
  </div>

  <nav class="header-nav">
    <a class="nav-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
    <a class="nav-link" href="#categories">Categories</a>
    <a class="nav-link" href="#products">Products</a>
    <a class="nav-link" routerLink="/about" routerLinkActive="active">About Us</a>
    <a class="nav-link" routerLink="/contact" routerLinkActive="active">Order Now</a>
  </nav>

  <div class="header-actions">
    <button class="cart-btn">
      <span class="cart-icon">&#128722;</span>
      Cart
      <span class="cart-count">0</span>
    </button>
  </div>
</header>
